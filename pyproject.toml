[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadpipe"
version = "0.1.0"
description = "Pipeline interno de prospecção para serviços locais nos EUA: sourcing, qualificação, tracking."
requires-python = ">=3.10"
# Versões fixas de propósito: pip antigo (Windows) entra em loop de horas
# tentando combinar faixas abertas. Com tudo pinado, resolve em segundos.
dependencies = [
    "typer==0.27.2",
    "click==8.5.0",
    "rich==15.0.0",
    "httpx==0.28.1",
    "playwright==1.63.0",
    "phonenumbers==9.0.39",
    "timezonefinder==8.2.0",
    "geonamescache==3.0.2",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "python-slugify==9.0.0",
    "pillow==12.3.0",
    "jinja2==3.1.6",
    "numpy==2.2.6",
    "h3==4.5.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
lp = "leadpipe.cli:app"
leadpipe = "leadpipe.cli:app"   # Windows: "lp" colide com o alias Out-Printer do PowerShell

[tool.setuptools.packages.find]
include = ["leadpipe*"]

[tool.setuptools.package-data]
leadpipe = ["hero/templates/*.html", "hero/assets/*", "ui/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
