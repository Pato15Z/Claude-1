[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadpipe"
version = "0.1.0"
description = "Pipeline interno de prospecção para serviços locais nos EUA: sourcing, qualificação, tracking."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "playwright>=1.45",
    "phonenumbers>=8.13",
    "timezonefinder>=6.5",
    "geonamescache>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "python-slugify>=8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
lp = "leadpipe.cli:app"

[tool.setuptools.packages.find]
include = ["leadpipe*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
